name: Parlor
options:
  bundleIdPrefix: dev.parlor
targets:
  Parlor:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
        excludes:
          - Info.plist
      - path: Resources
    dependencies:
      - framework: ../llama.cpp/build-apple/llama.xcframework
        embed: true
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: dev.parlor.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ON_COPY: NO
